<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linktree Personalizzato M Italia</title>
  
  <!-- Google Fonts: Titillium Web -->
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Titillium Web', sans-serif;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      color: #d20a10;
      padding: 40px 20px 20px 20px;
      box-sizing: border-box;
      text-align: center;
    }

    /* Logo M-Italia */
    img.profile {
      width: 140px; /* massimo 140px */
      margin-bottom: 15px;
    }

    /* Payoff sotto il logo */
    .payoff {
      color: #ffffff;
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.2;
      font-weight: 400;
    }

    /* Pulsanti */
    .link-button {
      display: block;
      width: 250px;
      padding: 14px 0;
      margin: 10px 0;
      text-align: center;
      color: #d20a10;
      text-decoration: none;
      border: 2px solid #d20a10;
      background-color: #000000;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s;
      border-radius: 0; /* angoli squadrati */
    }

    .link-button:hover {
      background-color: #d20a10;
      color: #000000;
    }

    /* Footer */
    footer {
      margin-top: 50px;
      padding-top: 20px;
      text-align: center;
      color: #ffffff;
      font-size: 12px;
      border-top: 1px solid #ffffff;
      line-height: 1.5;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <!-- Logo M-Italia -->
  <img src="https://raw.githubusercontent.com/m-italia/firma-email-assets/refs/heads/main/icons/logo-m-italia-big-wht.svg" alt="M-Italia Logo" class="profile">

  <!-- Payoff -->
  <div class="payoff">
    automotive technology<br>
    with italian passion
  </div>

  <!-- Pulsanti -->
  <a href="https://www.miosito.com" class="link-button">VISITA IL SITO</a>
  <a href="https://www.miosito.com/prodotti" class="link-button">PRODOTTI</a>
  <a href="https://www.miosito.com/newsletter" class="link-button">NEWSLETTER</a>
  <a href="https://wa.me/1234567890" class="link-button">CANALE WHATSAPP</a>
  <a href="https://www.miosito.com/contatti" class="link-button">CONTATTACI</a>

  <!-- Footer -->
  <footer>
    Copyright © 2026 – Tutti i diritti riservati<br>
    <strong>M-ITALIA SRL</strong><br>
    Via Tommaso Abbate, 43<br>
    30020 Quarto d'Altino (VE)<br>
    Partita IVA IT01333670329
  </footer>
</body>
</html>
