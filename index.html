<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Italia</title>

  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ─── VARIABLES ─────────────────────────────────────────── */
    :root {
      --red:         #d20a10;
      --red-dim:     rgba(210, 10, 16, 0.12);
      --black:       #000000;
      --white:       #ffffff;
      --gray:        #777777;
      --border:      rgba(255,255,255,0.22);
      --wa-green:    #25D366;
      --wa-dim:      rgba(37, 211, 102, 0.10);
      --wa-border:   rgba(37, 211, 102, 0.45);
      --maps-blue:   #4285F4;
      --maps-dim:    rgba(66, 133, 244, 0.10);
      --maps-border: rgba(66, 133, 244, 0.45);
    }

    /* ─── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Titillium Web', sans-serif;
      background-color: #111111;
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 24px 24px;
      overflow-x: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─── BACKGROUND ─────────────────────────────────────────── */
    /* ─── BACKGROUND IMAGE ───────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('https://cdn.jsdelivr.net/gh/m-italia/social@main/icons/sfondo-linktree.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 0;
    }
    /* overlay scuro per leggibilità */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── WRAPPER ────────────────────────────────────────────── */
    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }

    /* ─── LOGO ───────────────────────────────────────────────── */
    .logo-wrap {
      margin-bottom: 6px;
      opacity: 0;
      transform: translateY(-18px);
      animation: fadeUp 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }
    img.profile {
      width: 100px;
      display: block;
      filter: drop-shadow(0 8px 28px rgba(210,10,16,0.30));
    }

    /* ─── DIVIDER ────────────────────────────────────────────── */
    .divider {
      width: 36px;
      height: 2px;
      background: var(--red);
      margin: 8px auto 10px;
      opacity: 0;
      transform: scaleX(0);
      animation: scaleIn 0.5s ease 0.3s forwards;
    }

    /* ─── PAYOFF ─────────────────────────────────────────────── */
    .payoff {
      font-size: 11px;
      font-weight: 300;
      font-style: normal;
      color: var(--white);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.4;
      text-align: center;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
    }

    /* ─── BUTTONS ────────────────────────────────────────────── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .link-button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 20px;
      font-family: 'Titillium Web', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--white);
      background: transparent;
      /* bordo più spesso e più visibile */
      border: 2px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      opacity: 0;
      transform: translateY(16px);
      -webkit-tap-highlight-color: transparent;
    }

    /* staggered entry dal basso — ottimo su mobile */
    .link-button:nth-child(1) { animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) 0.40s forwards; }
    .link-button:nth-child(2) { animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) 0.50s forwards; }
    .link-button:nth-child(3) { animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) 0.60s forwards; }
    .link-button:nth-child(4) { animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) 0.70s forwards; }
    .link-button:nth-child(5) { animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) 0.80s forwards; }
    .link-button:nth-child(6) { animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) 0.90s forwards; }

    /* barra accent sinistra */
    .link-button::before {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 4px;
      height: 100%;
      background: var(--red);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.22s cubic-bezier(0.22,1,0.36,1);
    }

    /* hover desktop */
    .link-button:hover {
      border-color: var(--red);
      background: var(--red-dim);
      transform: translateY(-1px);
    }
    .link-button:hover::before { transform: scaleY(1); }

    /* :active — feedback immediato al tap su mobile */
    .link-button:active {
      transform: scale(0.97);
      background: var(--red-dim);
      border-color: var(--red);
    }
    .link-button:active::before { transform: scaleY(1); }

    /* ─── VARIANTI COLORE ────────────────────────────────────── */

    /* Canale WhatsApp */
    .link-button.btn-wa-channel {
      border-color: var(--wa-border);
    }
    .link-button.btn-wa-channel::before { background: var(--wa-green); }
    .link-button.btn-wa-channel:hover,
    .link-button.btn-wa-channel:active {
      border-color: var(--wa-green);
      background: var(--wa-dim);
    }

    /* Scrivici su WhatsApp — testo verde */
    .link-button.btn-wa {
      border-color: var(--wa-border);
      color: var(--wa-green);
    }
    .link-button.btn-wa::before { background: var(--wa-green); }
    .link-button.btn-wa:hover,
    .link-button.btn-wa:active {
      border-color: var(--wa-green);
      background: var(--wa-dim);
      color: var(--wa-green);
    }

    /* Vieni a trovarci — blu Maps */
    .link-button.btn-maps {
      border-color: var(--maps-border);
    }
    .link-button.btn-maps::before { background: var(--maps-blue); }
    .link-button.btn-maps:hover,
    .link-button.btn-maps:active {
      border-color: var(--maps-blue);
      background: var(--maps-dim);
    }

    /* ─── FOOTER ─────────────────────────────────────────────── */
    footer {
      margin-top: 20px;
      padding-top: 14px;
      width: 100%;
      border-top: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      color: #777777;
      font-size: 10.5px;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.1s forwards;
    }
    footer strong {
      display: block;
      font-weight: 700;
      color: #999999;
      letter-spacing: 0.18em;
      font-size: 10.5px;
    }

    /* ─── SOCIAL ICONS ───────────────────────────────────────── */
    .social-bar {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
      margin-bottom: 4px;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.2s forwards;
    }
    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .social-link:hover,
    .social-link:active {
      background: var(--red);
      color: var(--white);
      transform: translateY(-2px);
    }
    .social-link svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* ─── KEYFRAMES ──────────────────────────────────────────── */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      to { opacity: 1; transform: scaleX(1); }
    }

    /* ─── SCANLINE ───────────────────────────────────────────── */
    .scanline {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent, transparent 3px,
        rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
